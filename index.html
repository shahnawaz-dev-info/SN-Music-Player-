<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SN Music Player</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <main class="music-player">

        <header class="player-header">
            <h1>
                <i class="fa-solid fa-music"></i>
                SN Music Player
            </h1>
        </header>


        <!-- Song Details -->
        <section class="song-info">

            <h2 id="title">
                Song Title
            </h2>

            <p id="artist">
                Artist Name
            </p>

        </section>


        <!-- Audio Element -->
        <audio id="audio"></audio>


        <!-- Progress Section -->
        <section class="progress-section">

            <div class="time">

                <span id="current-time">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>


            <input 
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100">

        </section>



        <!-- Player Controls -->
        <section class="controls">

            <button id="prev" aria-label="Previous Song">

                <i class="fa-solid fa-backward-step"></i>

            </button>


            <button id="play" class="play-btn" aria-label="Play">

                <i class="fa-solid fa-play"></i>

            </button>


            <button id="next" aria-label="Next Song">

                <i class="fa-solid fa-forward-step"></i>

            </button>

        </section>



        <!-- Volume Control -->
        <section class="volume-control">

            <i class="fa-solid fa-volume-high"></i>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1">

        </section>



        <!-- Playlist -->
        <section class="playlist">

            <h3>
                <i class="fa-solid fa-list"></i>
                Playlist
            </h3>


            <ul id="playlist">

                <li data-index="0">
                    <i class="fa-solid fa-music"></i>
                    Song 1
                </li>


                <li data-index="1">
                    <i class="fa-solid fa-music"></i>
                    Song 2
                </li>


                <li data-index="2">
                    <i class="fa-solid fa-music"></i>
                    Song 3
                </li>

            </ul>

        </section>


    </main>



    <!-- JavaScript -->
    <script src="script.js"></script>


</body>

</html>
